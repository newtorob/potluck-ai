name: CI - API

on:
  pull_request:
    paths:
      - 'services/api/**'
      - '.github/workflows/ci-api.yml'
  push:
    branches:
      - main
    paths:
      - 'services/api/**'
      - '.github/workflows/ci-api.yml'

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      - name: Install dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff

      - name: Ruff check
        run: ruff check services/api/potluck_api

      - name: Ruff format check
        run: ruff format --check services/api/potluck_api

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: potluck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d potluck_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/potluck_test
      MAGIC_LINK_SECRET: test-secret-for-ci-only
      APP_URL: http://localhost:5173
      # Placeholder values so pydantic-settings doesn't fail during import.
      ENVIRONMENT: test
      SENTRY_DSN: ''
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_test_placeholder
      STRIPE_PRICE_ID: price_test_placeholder
      RESEND_API_KEY: re_test_placeholder
      EMAIL_FROM: noreply@example.com
      ANTHROPIC_API_KEY: sk-ant-test-placeholder
      OPENAI_API_KEY: sk-test-placeholder
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      - name: Install dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run database migrations
        working-directory: services/api
        run: alembic upgrade head

      - name: Run pytest
        working-directory: services/api
        run: pytest --tb=short -q

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        id: audit
        continue-on-error: true
        run: |
          pip-audit -r services/api/requirements.txt --strict \
            --format json --output pip-audit-report.json
          pip-audit -r services/api/requirements.txt --strict || true

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30
          if-no-files-found: ignore

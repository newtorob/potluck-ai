name: CI - Desktop App

on: []  # disabled: re-enable by restoring pull_request + push triggers

permissions:
  contents: read

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  python-sidecar:
    name: Python sidecar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/desktop/python/requirements.txt

      - name: Install dependencies
        working-directory: apps/desktop/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Ruff check
        run: ruff check apps/desktop/python/potluck_local

      - name: Import smoke test
        working-directory: apps/desktop/python
        run: python -c "from potluck_local.app import create_app; create_app()"

      - name: Check for tests directory
        id: check_tests
        shell: bash
        run: |
          if [ -d "apps/desktop/python/tests" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pytest
        if: steps.check_tests.outputs.exists == 'true'
        run: pytest apps/desktop/python/tests -q

  electron:
    name: Electron (syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/electron/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check main + preload
        run: |
          node --check main.js
          node --check preload.js

      - name: Syntax check scripts
        shell: bash
        run: |
          if [ -d "scripts" ]; then
            for f in scripts/*.js; do
              [ -f "$f" ] || continue
              echo "Checking $f"
              node --check "$f"
            done
          else
            echo "No scripts/ directory; skipping."
          fi

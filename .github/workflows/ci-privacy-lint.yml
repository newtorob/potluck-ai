name: CI - Privacy invariants

# Enforces the two manifesto-level rules from memory 42a7e671 + 1fc85a49:
#   - member_id MUST NOT appear in any peer-bound message construction
#     or coordinator→peer WebSocket send (lint #20).
#   - The contributor sidecar MUST NOT write prompt or response content
#     to disk, logs, or telemetry (lint #21).
#
# Runs on every push and PR. Fails the build on violations.

# Scoped to the privacy-relevant trees so the job (a static AST lint + a
# couple of pytest cases) only runs when one of the surfaces it guards
# changes. The local `make lint` + pre-commit hook still run on every
# commit; this is the gate a contributor cannot bypass with --no-verify.
on:
  push:
    branches: [main]
    paths: &privacy_paths
      - "scripts/dev/lint_privacy.py"
      - "services/coordinator/coordinator/**"
      - "services/coordinator/tests/**"
      - "apps/desktop/python/potluck_local/contributor/**"
      - "apps/desktop/python/potluck_local/routers/peer.py"
      - "apps/desktop/python/potluck_local/services/pool_routing.py"
      - "apps/desktop/python/potluck_local/services/gateway_routing.py"
      - ".github/workflows/ci-privacy-lint.yml"
  pull_request:
    paths: *privacy_paths

permissions:
  contents: read

concurrency:
  group: ci-privacy-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-lint:
    name: Privacy-invariant lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run privacy lint
        run: python3 scripts/dev/lint_privacy.py

      - name: Run coordinator privacy-invariant tests
        # The static lint above checks call sites; this pytest checks
        # the schema-level invariants on JobAssignedMessage itself
        # (no member_id field, no identifying keys when serialised).
        # Together they cover the architectural rule + every call site.
        working-directory: services/coordinator
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install -q -r requirements-dev.txt
          ./.venv/bin/pytest tests/ -q

# Note: the global name "potluck-api" was already taken on Fly, so this app is
# "potluck-cloud-api". Clients reach it by the custom domain (api.trypotluck.ai),
# so the internal app name is cosmetic.
app = "potluck-cloud-api"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

# Run DB migrations before the new release takes traffic. Deploy the API BEFORE
# the coordinator on a fresh DB: API migration 0008 drops the v0 peers +
# compute_credits stubs that the coordinator's migrations then re-create, so
# running the coordinator first races that drop.
[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the single machine warm. Two reasons this API must NOT auto-stop or
  # scale out at launch: (1) a cold start can exceed Stripe's webhook timeout,
  # delaying founding-badge grants; (2) the rate limiter is in-memory, so its
  # counts are only coherent on one always-on process. Revisit both when a
  # shared limiter store lands.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "3s"
    method = "GET"
    path = "/ready"

[env]
  ENV = "production"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "5s"
    type = "http"

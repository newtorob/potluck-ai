[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "potluck-coordinator"
version = "0.1.0"
description = "Potluck AI Phase G coordinator - peer registry, attestation, job routing, mesh control plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Potluck AI", email = "hello@trypotluck.ai" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["coordinator*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

app = "potluck-coordinator"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

# Coordinator migrations use their own alembic version table, so this is safe to
# run on every deploy. On a FRESH DB, deploy the API first (see its fly.toml) —
# its 0008 migration drops v0 stubs this service then re-creates.
[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8400
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "3s"
    method = "GET"
    path = "/ready"

[env]
  ENV = "production"
  # Bind every request to a real member via the cloud API's shared `sessions`
  # table instead of the dev STUB_MEMBER_ID. Requires DATABASE_URL to point at
  # the same Postgres as the API. The token/DERP-JWT/DATABASE_URL secrets the
  # prod preflight demands are set out-of-band via `fly secrets`.
  POTLUCK_SESSION_AUTH_ENABLED = "1"
  # Prod preflight is fail-closed: these two are non-secret config, so they live
  # here rather than in `fly secrets`.
  #   REQUIRE_REGISTERED_KEYS  — strict allowlist; an attesting device key must
  #     already be in member_keys (written during enrollment). VALIDATE the
  #     enrollment-then-attest path in dogfood before public launch: if
  #     enrollment does not pre-register the key, joins will fail closed.
  #   POTLUCK_DB_LINK_ENCRYPTED — acknowledges the DB link is encrypted at the
  #     network layer. True on Fly: the app reaches Postgres over the private
  #     6PN (.internal) WireGuard mesh, which asyncpg's ssl= arg can't express.
  REQUIRE_REGISTERED_KEYS = "true"
  POTLUCK_DB_LINK_ENCRYPTED = "1"
  # Refuse contributor builds whose binary_hash is not in contributor_releases.
  # The code default is advisory for dev and tests; production stays strict
  # until a signed desktop build is registered and the open pool is enabled.
  REQUIRE_REGISTERED_RELEASE = "true"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8400
    timeout = "5s"
    type = "http"

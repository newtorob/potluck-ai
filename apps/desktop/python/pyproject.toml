[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "potluck-local"
version = "0.1.0"
description = "Local FastAPI sidecar for the Potluck AI desktop app"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "AGPL-3.0" }

[project.scripts]
potluck-mcp = "potluck_local.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["potluck_local*"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

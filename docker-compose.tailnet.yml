# Tailnet override for cross-machine Phase G mesh dev.
#
# Purpose
# -------
# The base docker-compose.yml publishes the coordinator (8400) and DERP
# (8443/8444) on 0.0.0.0, which makes them reachable on the Mac's *localhost*
# and on any host interface that the OS will actually deliver inbound packets
# to. On macOS with the Tailscale **cask** (the Network-Extension / "macsys"
# build), inbound TCP to the host's tailnet IP (100.x) is dropped before it
# reaches the published port, so tailnet peers (e.g. a Linux box whose
# systemd unit points at http://<tailnet-ip>:8400 +
# tcp+insecure://<tailnet-ip>:8443) see the coordinator/DERP as offline even
# though `curl 127.0.0.1:8400/health` works on the Mac. Lifting that drop is a
# one-time admin step on the host (allow incoming connections for the
# Tailscale network extension).
#
# This override makes the port publishing *explicit about the tailnet IP* so the
# binding is self-documenting and so that, once the host-level inbound drop is
# lifted, the services are reachable on the exact IP those peers expect with no
# further changes.
#
# Usage
# -----
#   export POTLUCK_TAILNET_IP=$(tailscale ip -4)     # e.g. 100.101.102.103
#   docker compose -f docker-compose.yml -f docker-compose.tailnet.yml up -d
#
# or just:  make up-tailnet      (auto-detects the tailnet IP and verifies)
#
# Publishing on both the tailnet IP and 127.0.0.1 keeps localhost dev working
# (the desktop app + smoke scripts hit 127.0.0.1) while exposing the exact
# tailnet IP for peers.

services:
  coordinator:
    ports:
      - "127.0.0.1:8400:8400"
      - "${POTLUCK_TAILNET_IP:?set POTLUCK_TAILNET_IP=$(tailscale ip -4) or run 'make up-tailnet'}:8400:8400"

  derp:
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
      - "${POTLUCK_TAILNET_IP:?set POTLUCK_TAILNET_IP=$(tailscale ip -4) or run 'make up-tailnet'}:8443:8443"
      - "${POTLUCK_TAILNET_IP:?set POTLUCK_TAILNET_IP=$(tailscale ip -4) or run 'make up-tailnet'}:8444:8444"
